@font-face{font-family:Literata;src:url('/node_modules/@fontsource-variable/literata/files/literata-latin-wght-normal.woff2')}*{box-sizing:border-box}body{margin:0;background:#ebece2;color:#3d4538;font:12px system-ui;height:100dvh;display:flex;flex-direction:column}header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 35px;border-bottom:1px solid #dfe3d5;background:#f7f7ef;gap:15px}header span{color:#65715a;font-size:11px}h1{font:500 15px Literata,Georgia;margin:0}.caption{width:90%;max-width:1220px;margin:18px auto;color:#68745c;font-size:10px;display:flex;justify-content:space-between}.book{width:90%;max-width:1220px;flex:1;min-height:0;align-self:center;position:relative;background:#fcfbf6;border:1px solid #dfe3d5;box-shadow:0 5px 30px #3347280b;overflow:hidden;isolation:isolate}.viewport{position:absolute;inset:0;overflow:hidden}.track,.stack-spread{position:absolute;left:0;top:0;height:100%;display:flex;width:100%;will-change:transform}.track{transition:transform .55s cubic-bezier(.2,.7,.2,1)}.leaf{background:#fcfbf6;position:relative;flex-shrink:0;height:100%;padding:38px 48px 30px;font:20px/1.85 Literata,Georgia;color:#3d4538;overflow:hidden}.leaf h2{font:450 32px/1.35 Literata,Georgia;letter-spacing:-.6px;margin:0 0 25px}.leaf p{margin:0 0 1em}.leaf .kicker{font:9px/1.6 system-ui;letter-spacing:1.8px;color:#68745c;margin-bottom:18px}.leaf .number{position:absolute;bottom:12px;left:0;right:0;text-align:center;font:10px system-ui;color:#68745c}.leaf:after{content:'';position:absolute;right:0;top:0;bottom:0;width:1px;background:#e0e4d6}.gutter{position:absolute;left:50%;top:0;bottom:0;width:20px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#38452d0b,transparent);pointer-events:none;z-index:9}footer{width:90%;max-width:1220px;align-self:center;height:92px;display:flex;align-items:center;justify-content:space-between;gap:20px}button{font:12px system-ui;color:#4c6241;background:none;border:0;min-width <body><header><h1>When the steps returned</h1><span id="mechanism"></span></header><div class="caption"><span>SYNTHETIC · AI-GENERATED, UNVERIFIED · STUDY ONLY</span><span>Same four leaves</span></div><main class="book" aria-label="Motion concept"><div class="viewport" id="viewport"></div></main><footer><button id="previous" aria-label="Previous reader page">← Previous</button><span id="counter"></span><button id="next" aria-label="Next reader page">Next →</button></footer>
<script type="module">
import { PageFlip } from '/node_modules/page-flip/dist/js/page-flip.module.js';
const mode = new URLSearchParams(location.search).get('mode') || 'slide';

document.querySelector('#mechanism').textContent=labels[mode];
const viewport=document.querySelector('#viewport');const book=document.querySelector('.book');

const copy=[["When the steps returned", "Mira reached the harbour before the baker unlocked his shutters. A white dog slept beside the rope locker, one eye open to the sound of her steps. She had carried the brass key for eleven years without knowing which door it belonged to."], ["", "The tide had withdrawn beyond the broken jetty. On the exposed steps, green weed lay like ribbons dropped after a festival. Somewhere below the stonework, water knocked three times and then waited.", "She put the ledger on a bollard and unfolded the page her father had left blank. In the margin, a thin line of salt traced the outline of a house. No street in the town ran at that angle."], ["", "At the fish stall, old Salim was sharpening a knife he no longer used. He said the north bell had rung during the night. The bell tower had fallen into the sea before Mira was born, but he gave the news as calmly as the weather.", "A ferry appeared beyond the outer buoy without making a wake. Its windows reflected a summer sky while rain gathered above the harbour. Mira counted seven passengers and an eighth shadow beside the pilot."], ["", "She wanted to go home, boil water, and let the day become ordinary. Instead she opened the envelope again. The ink was still damp where her father had written, Bring the key when the steps return.", "The lower gate stood behind stacks of empty crates. Somebody had recently oiled the hinges. A small clean crescent interrupted the rust around the lock, exactly the width of the key in her pocket."]];
const leaf=(index)=>{const el=document.createElement('article');el.className='leaf';el.dataset.density='soft';el.style.width=book.clientWidth/columns+'px';el.innerHTML='<p class="kicker">THE TIDE NOTEBOOKS · '+String(index+1).padStart(2,'0')+'</p>'+(copy[index][0]?'<h2>'+copy[index][0]+'</h2>':'')+copy[index].slice(1).map(text=>'<p>'+text+'</p>').join('')+'<span class="number">'+(index+1)+'</span>';return el};
let flip;let track;
if(mode==='curl'){const el=document.createElement('div');el.id='flips';viewport.append(el);const nodes=copy.map((_,index)=>{const page=document.createElement('div');page.dataset.density='soft';page.append(leaf(index));el.append(page);return page});flip=new PageFlip(el,{width:book.clientWidth/columns,height:book.clientHeight,size:'fixed',usePortrait:columns===1,autoSize:false,showCover:false,flippingTime:550,maxShadowOpacity:.25,mobileScrollSupport:false,drawShadow:true,useMouseEvents:true,showPageCorners:false,disableFlipByClick:true});flip.loadFromHTML(nodes);flip.on('flip',event=>{current=event.data;update()});flip.on('changeState',event=>{busy=event.data!=='read'});}
else if(mode==='slide'){track=document.createElement('div');track.className='track';copy.forEach((_,index)=>track.append(leaf(index)));viewport.append(track);}
else {const spread=document.createElement('div');spread.className='stack-spread';for(let n=0;n<columns;n++)spread.append(leaf(n));viewport.append(spread);}
if(columns===2){const gutter=document.createElement('span');gutter.className='gutter';book.append(gutter)}
function update(){document.querySelector('#counter').textContent=(columns===2?(current+1)+'–'+Math.min(current+2,4):current+1)+' / 4';document.querySelector('#previous').disabled=current===0;document.querySelector('#next').disabled=current+columns>=4;viewport.dataset.page=String(current)}
function go(direction){if(busy)return;const target=Math.max(0,Math.min(columns===2?2:3,current+direction*columns));if(target===current)return;
if(mode==='curl'){direction>0?flip.flipNext():flip.flipPrev();return}
if(mode==='slide'){current=target;track.style.transform='translateX('+(-current*book.clientWidth/columns)+'px)';update();return}
const previous=viewport.querySelector('.stack-spread');const incoming=document.createElement('div');incoming.className='stack-spread stack-in'+(direction<0?' back':'');for(let n=0;n<columns&&target+n<4;n++)incoming.append(leaf(target+n));previous.classList.add('stack-out');if(direction<0)previous.classList.add('back');viewport.append(incoming);busy=true;current=target;update();setTimeout(()=>{previous.remove();incoming.className='stack-spread';busy=false},560)}
document.querySelector('#previous').onclick=()=>go(-1);document.querySelector('#next').onclick=()=>go(1);update();window.__MOTION_STUDY__={mode,columns,go,get current(){return current}};document.fonts.ready.then(()=>document.body.dataset.ready='true');
</script></body></html>

name: Phase 1 integrity and browser checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm test
      - run: npm run build
      - run: npm run test:evidence
      - run: npm run test:rules
      - name: Install Chromium using the hosted runner's existing system libraries
        timeout-minutes: 4
        run: npx playwright install chromium
      - name: Authenticated Spark writing, privacy, offline sync and recovery
        run: npm run test:cloud
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: phase1-test-evidence
          path: |
            playwright-report/
            test-results/
            docs/evidence/phase1/browser-results.json
            .local/spark-browser*
          if-no-files-found: ignore

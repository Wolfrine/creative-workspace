name: Recover the stalled prepublication runners
on:
  push:
    branches: [codex/noveliaa-phase-1]
    paths: [.github/workflows/recover-stalled-run.yml]
permissions:
  actions: write
  contents: read
jobs:
  cancel-only-stalled-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // One-time recovery, bound to the two observed runs and exact SHA.
            // Never cancel a run that has reached Firebase publication.
            for (const run_id of [39998452937, 39998461461]) {
              const run = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id });
              if (run.data.head_sha !== '6048118c1e60ca3792120204f1a48278ce0f129c' || run.data.status !== 'in_progress') continue;
              const jobs = await github.rest.actions.listJobsForWorkflowRun({ ...context.repo, run_id });
              const stalled = jobs.data.jobs.some(job => job.steps?.some(step => step.status === 'in_progress' && step.name === 'Run npx playwright install --with-deps chromium'));
              if (!stalled) { core.info('Run progressed beyond the observed stall; leaving it alone: ' + run_id); continue; }
              await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id });
              core.info('Cancelled stalled prepublication runner: ' + run_id);
            }

name: Firebase metadata preflight (read only)
on:
  workflow_dispatch:
  push:
    branches: [codex/noveliaa-phase-1]
    paths: [.github/workflows/firebase-preflight.yml, functions/scripts/inspect-firebase.mjs]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix functions ci
      - name: Verify app identity and author configuration
        env:
          VERIFIED_PROJECT: '${{ steps.auth.outputs.project_id }}'
        run: node functions/scripts/inspect-firebase.mjs
      # No credentials are printed, no API/billing/IAM changes, no deploy step.

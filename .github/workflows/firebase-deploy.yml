name: Deploy Noveliaa to Firebase
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - public/**
      - index.html
      - package*.json
      - vite.config.ts
      - firebase.json
      - firestore.rules
      - .firebaserc
      - deployment/**
      - functions/scripts/prepare-spark-release.mjs
      - functions/scripts/deploy-spark-rules.mjs
      - functions/scripts/reset-workspace.mjs
      - functions/src/**
      - functions/test/**
      - functions/package*.json
      - plugin/**
      - scripts/verify-*.mjs
      - .github/workflows/firebase-deploy.yml
permissions:
  contents: read
concurrency:
  group: firebase-noveliaa-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      # Only src/mcp-entry.mjs exports are deployed; old callables stay reference.
      - run: npm --prefix functions ci --no-audit --no-fund
      - run: npm --prefix functions run check
      - run: npm --prefix functions test
      - run: npm test
      - run: npm run test:evidence
      - run: npm run test:rules
      - name: Actual OAuth, Firestore and MCP HTTP integration
        run: npx firebase emulators:exec --only auth,firestore --project demo-noveliaa --config firebase.spark-test.json "npm --prefix functions run test:integration"
      - run: npm run build
      - name: Install Chromium using the hosted runner's existing system libraries
        timeout-minutes: 4
        run: npx playwright install chromium
      - run: npm run test:cloud
      - run: npm run test:browser
      - name: Verify retained writing/plugin source and visual evidence
        run: node scripts/verify-deployment-candidate.mjs
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - name: Verify exact Firebase app, site and private author
        env:
          VERIFIED_PROJECT: '${{ steps.auth.outputs.project_id }}'
        run: node functions/scripts/prepare-spark-release.mjs
      - name: Build with verified public Firebase SDK configuration
        run: npm run build
      - name: Release owner-only Rules using the supported Admin SDK
        env:
          VERIFIED_PROJECT: '${{ steps.auth.outputs.project_id }}'
        run: node functions/scripts/deploy-spark-rules.mjs
      - name: Publish private plugin Function and matching Hosting site
        run: npx firebase deploy --project noveliaa --only functions:noveliaa-plugin,hosting --non-interactive
      - name: Verify every hosted build file and Firebase app identity
        run: node scripts/verify-hosted.mjs
      - name: Verify live OAuth discovery, tool schemas and private-access denial
        run: node scripts/verify-plugin-hosted.mjs
      # One explicit owner request, idempotent by request ID. Later ordinary
      # releases do not repeat a reset or change an existing writing workspace.
      - name: Apply explicitly authorized workspace reset after the guarded app is live
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[workspace-reset:reset_585b26c53f054e56a01b66949bdec5ec]')
        env:
          VERIFIED_PROJECT: '${{ steps.auth.outputs.project_id }}'
          WORKSPACE_RESET_REQUEST_ID: reset_585b26c53f054e56a01b66949bdec5ec
        run: node functions/scripts/reset-workspace.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: spark-release-evidence
          include-hidden-files: true
          path: |
            .local/spark-browser*
            .local/hosted-verification.json
            .local/rules-release.json
            .local/plugin-hosted-verification.json
            .local/workspace-reset-result.json
            .local/browser-test-results/
            .local/spark-test-results/
          if-no-files-found: ignore

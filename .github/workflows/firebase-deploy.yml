name: Deploy Noveliaa to Firebase
on:
  workflow_dispatch:
  push:
    branches: [main, codex/noveliaa-phase-1]
    paths:
      - src/**
      - public/**
      - index.html
      - package*.json
      - vite.config.ts
      - firebase.json
      - firestore.rules
      - .firebaserc
      - deployment/**
      - functions/scripts/prepare-spark-release.mjs
      - functions/scripts/deploy-spark-rules.mjs
      - scripts/verify-*.mjs
      - .github/workflows/firebase-deploy.yml
permissions:
  contents: read
concurrency:
  group: firebase-noveliaa-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      # Admin SDK is used for emulator tests and owner setup in Actions.
      # The directory is not a Functions deployment source in firebase.json.
      - run: npm --prefix functions ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:evidence
      - run: npm run test:rules
      - run: npm run build
      - name: Install Chromium using the hosted runner's existing system libraries
        timeout-minutes: 4
        run: npx playwright install chromium
      - run: npm run test:cloud
      - run: npm run test:browser
      - name: Verify retained Spark source and visual evidence
        run: node scripts/verify-deployment-candidate.mjs
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - name: Verify exact Firebase app, site and private author on Spark
        env:
          VERIFIED_PROJECT: '${{ steps.auth.outputs.project_id }}'
        run: node functions/scripts/prepare-spark-release.mjs
      - name: Build with verified public Firebase SDK configuration
        run: npm run build
      - name: Release owner-only Rules using the supported Admin SDK
        env:
          VERIFIED_PROJECT: '${{ steps.auth.outputs.project_id }}'
        run: node functions/scripts/deploy-spark-rules.mjs
      - name: Publish the matching Hosting site
        run: npx firebase deploy --project noveliaa --only hosting --non-interactive
      - name: Verify every hosted build file and Firebase app identity
        run: node scripts/verify-hosted.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: spark-release-evidence
          include-hidden-files: true
          path: |
            .local/spark-browser*
            .local/hosted-verification.json
            .local/rules-release.json
            test-results/
          if-no-files-found: ignore
